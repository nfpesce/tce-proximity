<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TCE Proximity</title>
  <meta name="description" content="TCE Proximity dashboard. Quote and shipment files are processed locally in your browser and never uploaded.">
  <link rel="stylesheet" href="styles.css?v=1.02-1794233509">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">TCE</span>
      <div>
        <h1>TCE Proximity <span class="ver" title="Version and date/time of the last code change">V1.02 2026-11-09 11:11 AM</span></h1>
        <div class="sub" id="meta-line">No file open</div>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#/ranking" data-view="ranking">1. TCE Classification</a>
      <a href="#/quote" data-view="quote">2. Quote Detail</a>
      <a href="#/fc" data-view="fc">3. Proximity by FC</a>
      <a href="#/dependency" data-view="dependency">4. Dependency by FC</a>
      <a href="#/bids" data-view="bids">5. Bid-Item Ranking</a>
      <a href="#/ww" data-view="ww">6. WW Ranking</a>
      <a href="#/adjustments" data-view="adjustments">7. Adjustments</a>
    </nav>
    <div class="filebox">
      <label>Data</label>
      <div class="seg" id="source-seg" role="group" aria-label="Data source" title="Data source: quotes (one file per geo) or shipments (one .csv with all geos, analysed by SBB)">
        <button type="button" data-source="quotes" aria-pressed="true" class="on">Quotes</button><button type="button" data-source="shipments" aria-pressed="false">Shipments</button>
      </div>
      <label for="geo-select" id="geo-label" class="geo-label" hidden>Geo</label>
      <select id="geo-select" hidden title="Shipments geo (Europe + META = EMEA of quotes)"></select>
      <span class="local-badge" title="The file is processed in this browser and never uploaded">Local data</span>
      <span class="file-name" id="file-name">No file open</span>
      <select id="file-select" hidden title="Quotes file (geo) of the open data folder"></select>
      <a id="data-btn" class="btn ghost" href="#/data" title="Open a data folder: one quotes file per geo + the shipments file (CSV query output or .xlsx)">Data folder…</a>
      <button id="open-btn" class="btn">Open file…</button>
      <input type="file" id="file-input" accept=".xlsx,.csv" hidden>
    </div>
    <div id="adj-banner" class="adj-banner" hidden></div>
  </header>

  <main id="view" class="view"></main>

  <div id="loading" class="loading" hidden><div class="spinner"></div><span id="loading-text">Loading…</span></div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js?v=1.02-1794233509"></script>
</body>
</html>
